<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>帮助文档 - 叮咚鸡（Dondji）</title>
  <link rel="stylesheet" href="css/style.min.css?v=20260724a">
  <link rel="stylesheet" href="css/help.min.css?v=20260724a">
  <script>
    (function () {
      try {
        if (localStorage.getItem('uvk1-web-theme') === 'light') {
          document.documentElement.classList.add('theme-light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="help-page">
  <header class="help-header">
    <a href="index.html" class="help-back-btn" data-i18n-title="helpBack">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      <span data-i18n="helpBack">返回</span>
    </a>
    <h1 class="help-title" data-i18n="helpTitle">帮助文档</h1>
    <button type="button" id="langSwitchBtn" class="lang-switch lang-switch--help" title="切换语言" aria-label="切换语言" data-i18n-title="langSwitchTitle" data-i18n-aria="langSwitchTitle">
      <svg class="lang-switch__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span class="lang-switch__text" data-i18n="langSwitchLabel">EN</span>
    </button>
    <button type="button" id="themeToggleBtn" class="theme-toggle theme-toggle--help" title="切换浅色主题" aria-label="切换浅色主题" data-i18n-title="themeToggleTitle" data-i18n-aria="themeToggleTitle">
      <svg class="theme-toggle__icon theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <div class="help-layout">
    <aside class="help-sidebar" id="helpSidebar">
      <nav class="help-toc" id="helpToc">
        <div class="help-toc-loading" data-i18n="helpTocLoading">加载中...</div>
      </nav>
    </aside>

    <main class="help-content" id="helpContent">
      <div class="help-content-loading">
        <div class="loading-spinner"></div>
        <span data-i18n="helpContentLoading">正在加载文档...</span>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/lang.min.js?v=20260725b"></script>
  <script>
    (function() {
      var loadToken = 0;

      var themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          var isLight = document.documentElement.classList.toggle('theme-light');
          try {
            localStorage.setItem('uvk1-web-theme', isLight ? 'light' : 'dark');
          } catch (e) {}
        });
      }

      function t(key) {
        if (typeof window.t === 'function') return window.t(key);
        return key;
      }

      function getLang() {
        if (typeof window.getCurrentLang === 'function') return window.getCurrentLang();
        return 'zh';
      }

      function helpMdPath() {
        return getLang() === 'en' ? 'data/help.en.md' : 'data/help.zh.md';
      }

      function buildToc(headings) {
        if (headings.length === 0) {
          return '<div class="help-toc-empty">' + t('helpTocEmpty') + '</div>';
        }

        var html = '<ul class="help-toc-list">';
        headings.forEach(function(heading) {
          var indent = (heading.level - 1) * 16;
          html += '<li class="help-toc-item help-toc-item--level-' + heading.level + '" style="padding-left: ' + indent + 'px">';
          html += '<a href="#' + heading.id + '" class="help-toc-link">' + heading.text + '</a>';
          html += '</li>';
        });
        html += '</ul>';
        return html;
      }

      function renderMarkdown(md) {
        var contentEl = document.getElementById('helpContent');
        var tocEl = document.getElementById('helpToc');
        if (!contentEl || !tocEl) return;

        marked.setOptions({
          breaks: true,
          gfm: true
        });

        var rawHtml = marked.parse(md);
        var headings = [];
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = rawHtml;

        var headingElements = tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6');
        headingElements.forEach(function(heading, index) {
          var id = 'heading-' + index + '-' + heading.textContent.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
          heading.id = id;
          headings.push({
            level: parseInt(heading.tagName.charAt(1), 10),
            id: id,
            text: heading.textContent
          });
        });

        contentEl.innerHTML = tempDiv.innerHTML;
        tocEl.innerHTML = buildToc(headings);

        var tocLinks = document.querySelectorAll('.help-toc-link');
        tocLinks.forEach(function(link) {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            var targetId = this.getAttribute('href').slice(1);
            var targetElement = document.getElementById(targetId);
            if (targetElement) {
              targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.pushState(null, null, '#' + targetId);
            }
          });
        });

        if (window.location.hash) {
          var hashId = window.location.hash.slice(1);
          var hashEl = document.getElementById(hashId);
          if (hashEl) {
            setTimeout(function() {
              hashEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
          }
        }
      }

      function showLoadError() {
        var contentEl = document.getElementById('helpContent');
        var tocEl = document.getElementById('helpToc');
        if (contentEl) {
          contentEl.innerHTML = '<div class="help-content-error"><p>' + t('helpContentError') + '</p><p>' + t('helpContentErrorHint') + '</p></div>';
        }
        if (tocEl) {
          tocEl.innerHTML = '<div class="help-toc-empty">' + t('helpContentError') + '</div>';
        }
      }

      function loadHelpDoc() {
        var token = ++loadToken;
        var contentEl = document.getElementById('helpContent');
        var tocEl = document.getElementById('helpToc');
        var path = helpMdPath() + '?v=' + Date.now();

        if (contentEl) {
          contentEl.innerHTML = '<div class="help-content-loading"><div class="loading-spinner"></div><span data-i18n="helpContentLoading">' + t('helpContentLoading') + '</span></div>';
        }
        if (tocEl) {
          tocEl.innerHTML = '<div class="help-toc-loading" data-i18n="helpTocLoading">' + t('helpTocLoading') + '</div>';
        }

        function loadWithXhr() {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', path, true);
          xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4 || token !== loadToken) return;
            if (xhr.status === 200 || xhr.status === 0) {
              renderMarkdown(xhr.responseText);
            } else {
              showLoadError();
            }
          };
          xhr.send();
        }

        fetch(path)
          .then(function(response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
          })
          .then(function(md) {
            if (token !== loadToken) return;
            renderMarkdown(md);
          })
          .catch(function() {
            if (token !== loadToken) return;
            loadWithXhr();
          });
      }

      window.addEventListener('langchange', loadHelpDoc);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadHelpDoc);
      } else {
        loadHelpDoc();
      }
    })();
  </script>
</body>
</html>
